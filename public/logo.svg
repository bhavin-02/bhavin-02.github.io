<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="12" y1="10" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f4e6c0" />
      <stop offset="48%" stop-color="#d4af6a" />
      <stop offset="100%" stop-color="#b0863f" />
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15120b" />
      <stop offset="100%" stop-color="#07070c" />
    </linearGradient>
  </defs>

  <!-- App-icon tile -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="15"
        fill="url(#tile)" stroke="#d4af6a" stroke-opacity="0.45" stroke-width="1.5" />

  <!-- Serif "B" monogram -->
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="40" fill="url(#gold)">B</text>
</svg>
